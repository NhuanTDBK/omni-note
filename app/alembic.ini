# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# max length of characters to apply to the
# "slug" field
#truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
#revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# source to be detected as revisions in the versions/ directory
#sourceless = false

# version location specification; this defaults
# to alembic/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# The path separator used here should be the separator specified by "version_locations_separator".
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions
# version_locations_separator = os.pathsep

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.url = postgresql+psycopg2://postgres:adminnolook@127.0.0.1:5432/omniapp

[post_write_hooks]
# post_write_hooks defines scripts or Python functions to run after a revision file
# is generated.  See the documentation for further detail and examples.
# hooks =

# format the generated revision file to be PEP8 compliant
# hooks.format = black
# hooks.format.type = console_scripts
# hooks.format.entrypoint = black
# hooks.format.options = -l 79